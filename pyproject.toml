[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "slim-samples"
version = "0.1.0"
description = "Sample module for the SLIM LIMS ecosystem: containers, custody, storage, retention and disposal"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "pydantic>=2.6,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13",
]

[project.optional-dependencies]
postgres = ["psycopg2-binary>=2.9"]
dev = [
    "pytest>=8",
    "coverage[toml]>=7.5",
    "ruff==0.16.9",
    "psycopg2-binary>=2.9",
]

[tool.setuptools.packages.find]
include = ["slim_samples*"]

[tool.setuptools.package-data]
slim_samples = ["persistence/alembic.ini", "persistence/migrations/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["slim_samples"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["docs", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
